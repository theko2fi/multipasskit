[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multipasskit"
version = "0.1.0"
description = "A multipass kit containing an API and a SDK to manage multipass resources"
readme = "README.md"
authors = [
    { name = "Kenneth KOFFI" }
]
license = { text = "MIT License" }
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "haikunator==2.1.0",
    "click==8.1.8",
]

[project.urls]
Documentation = "https://github.com/theko2fi/multipasskit/wiki"
Source = "https://github.com/theko2fi/multipasskit"
Tracker = "https://github.com/theko2fi/multipasskit/issues"
LinkedIn = "https://www.linkedin.com/in/kenneth-koffi-6b1218178"

[project.optional-dependencies]
api = [
    "celery[redis]==5.4.0",
    "uvicorn==0.27.1",
    "fastapi==0.109.2",
]

[tool.setuptools.packages.find]
include = ["multipasskit", "multipasskit.*"]

[project.scripts]
multipasskit = "multipasskit.api.cli:cli"